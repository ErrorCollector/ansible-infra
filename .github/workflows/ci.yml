name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: actions/setup-python@v7.1.0
                with:
                    python-version: "3.15"
                    cache: pip
                    cache-dependency-path: requirements-dev.txt
            -   run: pip install -r requirements-dev.txt
            -   name: yamllint
                run: yamllint --strict .
            -   name: checksums of pinned downloads
                # Renovate updates the versions, the checksums next to them have to follow
                run: scripts/check-checksums.py
                env:
                    GITHUB_TOKEN: ${{ github.token }}
            -   name: ansible-lint (per collection)
                # The collections are linked into ansible-lint's collection path, so playbooks
                # find their roles by FQCN (errorcollector.base.reboot). The yamllint config is
                # in the repo root, ansible-lint only looks into the working directory.
                run: |
                    rc=0
                    export YAMLLINT_CONFIG_FILE="$PWD/.yamllint"
                    mkdir -p .ansible/collections/ansible_collections/errorcollector
                    for c in collections/*/; do
                        ln -sfn "$PWD/${c%/}" ".ansible/collections/ansible_collections/errorcollector/$(basename "$c")"
                    done
                    for c in collections/*/; do
                        echo "::group::$c"
                        (cd "$c" && ansible-lint) || rc=1
                        echo "::endgroup::"
                    done
                    exit $rc

    leaks:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
                with:
                    fetch-depth: 0
            -   name: gitleaks
                run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
            -   name: No infrastructure names or IPs
                env:
                    # not available in pull requests from forks, the script then only checks IPs
                    INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
                run: scripts/check-denylist.sh
