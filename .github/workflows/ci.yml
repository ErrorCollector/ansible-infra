name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: actions/setup-python@v7.1.0
                with:
                    python-version: "3.13"
                    cache: pip
                    cache-dependency-path: requirements-dev.txt
            -   run: pip install -r requirements-dev.txt
            -   name: yamllint
                run: yamllint --strict .
            -   name: ansible-lint (per collection)
                run: |
                    rc=0
                    for c in collections/*/; do
                        echo "::group::$c"
                        (cd "$c" && ansible-lint) || rc=1
                        echo "::endgroup::"
                    done
                    exit $rc

    leaks:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
                with:
                    fetch-depth: 0
            -   name: gitleaks
                run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
            -   name: No infrastructure names or IPs
                env:
                    # not available in pull requests from forks, the script then only checks IPs
                    INFRA_DENYLIST: ${{ secrets.INFRA_DENYLIST }}
                run: scripts/check-denylist.sh
