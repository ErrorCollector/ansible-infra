# errorcollector.base: GitLab CI jobs for the project repos.
# Include it pinned to the same base tag as requirements.d/base.yml (Renovate updates both in one MR)
# and extend the hidden jobs per domain:
#
#   include:
#       # renovate: datasource=github-tags packageName=ErrorCollector/ansible-infra depName=errorcollector.base extractVersion=^base-v(?<version>.+)$
#       -   remote: https://raw.githubusercontent.com/ErrorCollector/ansible-infra/base-vX.Y.Z/collections/base/extras/gitlab-ci.yml
#
#   plan:pangolin:
#       extends: .infra:plan
#       variables:
#           DOMAIN: pangolin
#
#   deploy:pangolin:
#       extends: .infra:deploy
#       variables:
#           DOMAIN: pangolin
#
# Plan runs in the stage "test", deploy in "deploy". Both need protected file variables of the project,
# which GitLab only hands to protected branches, so they only run there:
#   INFRA_SSH_KEY     private key of the provisioning user
#   INFRA_VAULT_PASS  vault password
#   INFRA_KNOWN_HOSTS known_hosts of all hosts (host key checking is always on in CI)
# Deploy is a manual job on the default branch and leaves out the inventory group gitlab_server. The GitLab server
# gets a button of its own: the job restarts the GitLab that runs it (the runner keeps going and reports back once
# GitLab is up again), so it is never part of another deploy. Keep the local deploy as fallback.
#
#   deploy:gitlab:server:
#       extends: .infra:deploy
#       variables:
#           DOMAIN: gitlab
#           HOSTS: gitlab
#           INFRA_GITLAB_SERVER: "true"
#
# Both jobs only appear when the push changes a file of the domain or a file matching INFRA_CHANGES (default:
# inventory.yml, ansible.cfg, site.yml). Files of the domain: requirements.d/$DOMAIN.yml (its version),
# {group_vars,host_vars}/*/$DOMAIN.yml and $DOMAIN.vault.yml (its variables) and templates/$DOMAIN/ (its templates).
# Variables used by the project's own roles (or by them and a domain) stay in vars.yml/vault.yml.
# Override INFRA_CHANGES per job for jobs without a domain, e.g. one app role:
#
#   plan:monitor:
#       extends: .infra:plan
#       variables:
#           HOSTS: monitor
#           TAGS: monitor
#           INFRA_CHANGES: "{roles/example.monitor/**/*,host_vars/monitor/{vars,vault}.yml,inventory.yml,site.yml}"
#
# Pipelines started by hand (Build > Pipelines > Run pipeline), by the API or a schedule have every plan and deploy
# job (INFRA_PIPELINE=deploy, the default).
#
# Status and reboots do not depend on a change, they only exist in pipelines with INFRA_PIPELINE=reboot on the default
# branch (Run pipeline, or a schedule with that variable); such a pipeline has no plans and no deploys:
#
#   status:
#       extends: .infra:status          # os-info and reboot-status, a warning (exit code 3) when hosts need a reboot
#
#   reboot:web01:                       # one button per host, reboots only when the host needs it
#       extends: .infra:reboot
#       variables:
#           HOSTS: web01
#
#   reboot:runner01:                    # a runner must not reboot itself: run it on another one
#       extends: .infra:reboot
#       tags: [arm64]
#       variables:
#           HOSTS: runner01
#
# The GitLab server needs INFRA_GITLAB_SERVER as for deploys. A schedule (Build > Pipeline schedules) with
# INFRA_PIPELINE=reboot runs status regularly; the reboot buttons stay manual.
# Jobs that follow a deploy (e.g. a notification with needs: deploy:<domain>) extend .infra:after-deploy and set
# the same DOMAIN/INFRA_CHANGES, so they exist exactly when the deploy job does.

# Run pipeline offers INFRA_PIPELINE: "deploy" (default, also for pushes) has plans and deploy buttons, "reboot" only
# status and the reboot buttons. Project jobs that should not run in a reboot pipeline extend .infra:not-reboot.
variables:
    INFRA_PIPELINE:
        value: deploy
        options: [deploy, reboot]
        description: "deploy: plans and deploy buttons; reboot: only status and the reboot buttons (default branch)"

.infra:not-reboot:
    rules:
        -   if: $INFRA_PIPELINE == "reboot"
            when: never
        -   when: on_success

.infra:job:
    image: alpine/ansible:2.21.0
    variables:
        ANSIBLE_HOST_KEY_CHECKING: "True"
        # Runner build dirs are often world writable: Ansible ignores ./ansible.cfg there unless it is named explicitly
        ANSIBLE_CONFIG: "$CI_PROJECT_DIR/ansible.cfg"
        ANSIBLE_FORCE_COLOR: "true"
        # rules:changes glob (File.fnmatch, {a,b} allowed) besides requirements.d/$DOMAIN.yml
        INFRA_CHANGES: "{inventory.yml,ansible.cfg,site.yml}"
    before_script:
        - apk add -q --no-cache bash make git
        - |
            if [ ! -f "${INFRA_SSH_KEY:-}" ] || [ ! -f "${INFRA_VAULT_PASS:-}" ] || [ ! -f "${INFRA_KNOWN_HOSTS:-}" ]; then
                echo "Protected file variables INFRA_SSH_KEY, INFRA_VAULT_PASS and INFRA_KNOWN_HOSTS are missing (protected branches only)"
                exit 1
            fi
        - install -m 600 "$INFRA_VAULT_PASS" .ansible_vault_pass
        - install -m 700 -d ~/.ssh
        - install -m 600 "$INFRA_KNOWN_HOSTS" ~/.ssh/known_hosts
        # OpenSSH rejects a key without a newline after the last line, and variables often lose it
        - (cat "$INFRA_SSH_KEY"; echo) > ~/.ssh/infra_key && chmod 600 ~/.ssh/infra_key
        - export ANSIBLE_SSH_KEY_FILE="$HOME/.ssh/infra_key"
        # errorcollector.base brings Makefile.inc; the bootstrap target of the project Makefile needs Docker
        - ansible-galaxy collection install -r requirements.d/base.yml -p collections
        - make install

.infra:plan:
    extends: .infra:job
    stage: test
    rules:
        -   if: $INFRA_PIPELINE == "reboot"
            when: never
        # changes compares with the previous push of the branch; a new branch counts as changed everywhere
        -   if: $CI_COMMIT_REF_PROTECTED == "true"
            changes: &infra_changes
                - requirements.d/$DOMAIN.yml
                # without a domain these match nothing
                - "{group_vars,host_vars}/*/$DOMAIN.yml"
                - "{group_vars,host_vars}/*/$DOMAIN.vault.yml"
                - templates/$DOMAIN/**/*
                - $INFRA_CHANGES
    script:
        - make ci-plan

.infra:deploy:
    extends: .infra:job
    stage: deploy
    rules:
        -   if: $INFRA_PIPELINE == "reboot"
            when: never
        -   if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
            changes: *infra_changes
            when: manual
    # One environment per deploy job: "Prevent outdated deployment jobs" only blocks a button once the same job ran in a
    # newer pipeline. With a shared environment any later deploy would block the open buttons of older pipelines, and
    # with rules:changes a domain's button often only exists in an older pipeline.
    environment:
        name: production/$CI_JOB_NAME_SLUG
    resource_group: infra-deploy
    script:
        - make ci-deploy

.infra:after-deploy:
    variables:
        INFRA_CHANGES: "{inventory.yml,ansible.cfg,site.yml}"
    rules:
        -   if: $INFRA_PIPELINE == "reboot"
            when: never
        -   if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
            changes: *infra_changes

.infra:status:
    extends: .infra:job
    stage: test
    rules:
        -   if: $INFRA_PIPELINE == "reboot" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # hosts that need a reboot show as warning, not as failed pipeline
    allow_failure:
        exit_codes: [3]
    script:
        # column and sort -V for the tables
        - apk add -q --no-cache coreutils util-linux-misc
        - make os-info
        - make reboot-status | tee reboot-status.log
        - if grep -q '^→ make reboot' reboot-status.log; then exit 3; fi

.infra:reboot:
    extends: .infra:job
    stage: deploy
    rules:
        -   if: $INFRA_PIPELINE == "reboot" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
            when: manual
    # never at the same time as a deploy
    resource_group: infra-deploy
    script:
        - make ci-reboot
