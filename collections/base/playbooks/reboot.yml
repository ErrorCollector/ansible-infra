# Controlled reboot, one host at a time: make reboot HOSTS=h1,h2|all [FORCE=1]
# A failing host does not stop the others (see role errorcollector.base.reboot);
# the second play fails those hosts, so the run ends with a non-zero exit.
-   name: Reboot hosts that need it
    hosts: all
    become: true
    serial: 1
    gather_facts: false
    roles:
        -   role: errorcollector.base.reboot

-   name: Report failed hosts
    hosts: all
    gather_facts: false
    tasks:
        -   name: Reboot failed
            ansible.builtin.fail:
                msg: "{{ reboot_failure }}"
            when: reboot_failure is defined
