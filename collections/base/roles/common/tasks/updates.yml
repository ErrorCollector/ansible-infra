# Automatic OS updates: dnf-automatic installs all updates daily (~06:00 UTC) and
# never reboots on its own. Reboots are done controlled via `make reboot`.
-   name: Install dnf-automatic and dnf-plugins-core (needs-restarting)
    ansible.builtin.dnf:
        name:
            - dnf-automatic
            - dnf-plugins-core
        state: present

-   name: Configure dnf-automatic
    ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: "^#?\\s*{{ item.key }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
        insertafter: '^\[commands\]'
    loop:
        - { key: upgrade_type, value: default }
        - { key: download_updates, value: "yes" }
        - { key: apply_updates, value: "yes" }
        - { key: reboot, value: never }
    # automatic.conf only exists once dnf-automatic is installed (not in --check mode)
    ignore_errors: "{{ ansible_check_mode }}"

-   name: Enable dnf-automatic timer
    ansible.builtin.systemd_service:
        name: dnf-automatic-install.timer
        state: started
        enabled: true
    ignore_errors: "{{ ansible_check_mode }}"

# Metrics for Prometheus alerts (reboot required, pending updates) via the
# node_exporter textfile collector
-   name: Ensure node_exporter textfile directory exists
    ansible.builtin.file:
        path: "{{ common_textfile_dir }}"
        state: directory
        mode: "0755"

-   name: Install update status script
    ansible.builtin.copy:
        src: update-status.sh
        dest: "/usr/local/sbin/{{ infra_brand }}-update-status"
        mode: "0755"

-   name: Install update status systemd units
    ansible.builtin.template:
        src: "update-status.{{ item }}.j2"
        dest: "/etc/systemd/system/{{ infra_brand }}-update-status.{{ item }}"
        mode: "0644"
    loop:
        - service
        - timer

-   name: Enable update status timer
    ansible.builtin.systemd_service:
        name: "{{ infra_brand }}-update-status.timer"
        state: started
        enabled: true
        daemon_reload: true
    # the unit files do not exist yet in --check mode
    ignore_errors: "{{ ansible_check_mode }}"

# The metrics used to be named <brand>_* (e.g. lde_reboot_required) in <brand>_updates.prom
-   name: Remove update metrics with the old names
    ansible.builtin.file:
        path: "{{ common_textfile_dir }}/{{ infra_brand }}_updates.prom"
        state: absent
    when: infra_brand != 'infra'

-   name: Write update status metrics now
    ansible.builtin.systemd_service:
        name: "{{ infra_brand }}-update-status.service"
        state: started
    changed_when: false
    ignore_errors: "{{ ansible_check_mode }}"
