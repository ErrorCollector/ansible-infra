# GitLab server, imported by the project site.yml: import_playbook: errorcollector.gitlab.server
# From CI only in a job of its own (INFRA_GITLAB_SERVER=true, HOSTS=<server>, see extras/gitlab-ci.yml of
# errorcollector.base), otherwise ci-deploy excludes the group gitlab_server and the role refuses to run. Locally:
# make deploy DOMAIN=gitlab HOSTS=<server>. Update the server before its runners.
-   name: GitLab server
    hosts: gitlab_server
    become: true
    roles:
        -   role: errorcollector.gitlab.gitlab
            tags: [gitlab, gitlab_server]
        -   role: errorcollector.base.collection_version
            collection_version_name: gitlab
            tags: [gitlab]
