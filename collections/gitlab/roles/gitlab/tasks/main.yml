# The GitLab server is deployed locally only: a CI job would update the GitLab that runs it.
# Dry runs (--check, make plan) are fine.
-   name: Refuse to deploy the GitLab server from GitLab CI
    ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'GITLAB_CI') | length == 0
        fail_msg: "The GitLab server is deployed locally only: make deploy DOMAIN=gitlab HOSTS=<server>"
        quiet: true
    when: not ansible_check_mode

-   name: GitLab
    ansible.builtin.import_tasks: gitlab.yml

-   name: Backups
    ansible.builtin.import_tasks: backup.yml
