# A CI job restarts the GitLab that runs it: only a job of its own may deploy the server (INFRA_GITLAB_SERVER=true,
# see extras/gitlab-ci.yml of errorcollector.base). Dry runs (--check, make plan) and local deploys are fine.
-   name: Refuse to deploy the GitLab server from other GitLab CI jobs
    ansible.builtin.assert:
        that: >-
            lookup('ansible.builtin.env', 'GITLAB_CI') | length == 0
            or lookup('ansible.builtin.env', 'INFRA_GITLAB_SERVER') == 'true'
        fail_msg: "The GitLab server needs its own deploy job (INFRA_GITLAB_SERVER=true) or a local deploy: make deploy DOMAIN=gitlab HOSTS=<server>"
        quiet: true
    when: not ansible_check_mode

-   name: GitLab
    ansible.builtin.import_tasks: gitlab.yml

-   name: Backups
    ansible.builtin.import_tasks: backup.yml
