-   name: Restart cleanup timer
    ansible.builtin.systemd_service:
        name: docker-cleanup.timer
        state: restarted
        daemon_reload: true

# Stops every container including the runner and its jobs
-   name: Restart containerd and docker
    ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
    loop:
        - containerd
        - docker
