# renovate: datasource=docker depName=docker.io/fosrl/newt
newt_version: "1.20.1"
newt_image: fosrl/newt

# One Newt container per site (see meta/argument_specs.yml). A site without id is skipped on that host,
# so the list can live in group_vars and the ids in host_vars. The default site keeps the variables
# the projects already use.
newt_sites:
    -   name: newt
        dir: "{{ pangolin_newt_dir | default('/opt/newt') }}"
        endpoint: "{{ pangolin_newt_endpoint | default('') }}"
        id: "{{ pangolin_newt_id | default('') }}"
        secret: "{{ pangolin_newt_secret | default('') }}"
