# Domain playbook, imported by the project site.yml: import_playbook: errorcollector.web.site
# Hosts come from the inventory group traefik.
-   name: Traefik
    hosts: traefik
    become: true
    roles:
        -   role: errorcollector.web.traefik
            tags: [web, traefik]
        # last, only on a run of the whole domain: infra_collection_version for the drift alert
        -   role: errorcollector.base.collection_version
            collection_version_name: web
            tags: [web]
